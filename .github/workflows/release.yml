name: Release distribution

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.7.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || exit 1
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm docs:build
      - name: Pack all public packages
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: pnpm release:pack --version "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: openstyle-${{ steps.version.outputs.tag }}
          path: artifacts/releases/${{ steps.version.outputs.tag }}/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openstyle-${{ needs.build.outputs.tag }}
          path: release
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create prerelease and upload missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --json id > /dev/null; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "OpenStyle $RELEASE_TAG" --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > existing-assets.txt
          mkdir -p existing-assets
          missing=()
          for asset in release/*.tgz release/*.zip release/SHA256SUMS; do
            name=$(basename "$asset")
            if grep -Fxq "$name" existing-assets.txt; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir existing-assets
              if ! cmp -s "$asset" "existing-assets/$name"; then
                echo "Refusing to overwrite a different published asset: $name" >&2
                exit 1
              fi
            else
              missing+=("$asset")
            fi
          done
          if ((${#missing[@]})); then
            gh release upload "$RELEASE_TAG" "${missing[@]}"
          fi
